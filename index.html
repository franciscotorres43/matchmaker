<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>matchmaker</title>
    <style>
    body {
        background-color: #ffe6f0; /* lighter pink outside */
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center; /* horizontal center */
        align-items: center;     /* vertical center */
        height: 100vh;           /* full screen height */
        margin: 0;
    }

    .container {
        background-color: #ffb6c1; /* darker pink box */
        padding: 30px;
        border-radius: 15px;
        width: 400px;
        text-align: center;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);

         position: relative;
    z-index: 1;
    }

    select, button {
        width: 80%;
        padding: 8px;
        margin-top: 5px;
        border-radius: 8px;
        border: none;
    }

    button {
        background-color: #ff69b4;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background-color: #ff4da6;
    }

    #campatibility {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
    }

    .hearts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* allows clicking through */
    overflow: hidden;
    z-index: 0;
}

.heart {
    position: absolute;
    bottom: -50px;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}

</style>
    </head>
    <body>
        <div class="hearts"></div>
    <div class="container">
    <h1>💖 Matchmaker 💖</h1>
    <p>This test will determine weather you and I are trully compatible, answer with your honest thoughts and see where you land!</p>

<!-- reference for HTML "option" tabs/fields: https://www.w3schools.com/tags/tag_option.asp -->

    <label>Dogs are better than cats</label><br />
    <select id="q1">
        <option value="5">Strongly Agree</option>
        <option value="4">Agree</option>
        <option value="3">Neither agree nor disagree</option>
        <option value="2">Disagree</option>
        <option value="1">Strongly Disagree</option>
    </select>
    <br /><br />
    <label>Android phones are better than Iphones.</label><br />
    <select id="q2">
        <option value="5">Strongly Agree</option>
        <option value="4">Agree</option>
        <option value="3">Neither agree nor disagree</option>
        <option value="2">Disagree</option>
        <option value="1">Strongly Disagree</option>
    </select>
    <br /><br />
    <label>Tacos are better than burritos</label><br />
    <select id="q3">
        <option value="5">Strongly Agree</option>
        <option value="4">Agree</option>
        <option value="3">Neither agree nor disagree</option>
        <option value="2">Disagree</option>
        <option value="1">Strongly Disagree</option>
    </select>
    <br /><br />
    <label>Summer over winter</label><br />
    <select id="q4">
        <option value="5">Strongly Agree</option>
        <option value="4">Agree</option>
        <option value="3">Neither agree nor disagree</option>
        <option value="2">Disagree</option>
        <option value="1">Strongly Disagree</option>
    </select>
    <br /><br />
    <label>Vanilla is better than chocolate</label><br />
    <select id="q5">
        <option value="5">Strongly Agree</option>
        <option value="4">Agree</option>
        <option value="3">Neither agree nor disagree</option>
        <option value="2">Disagree</option>
        <option value="1">Strongly Disagree</option>
    </select>
    <br /><br /><br />
    <button onclick="calculatecampatibility()">Calculate Campatibility</button>
    <p id="campatibility"></p>
  </div>
</body>

<script>

    function createHearts() {
    const heartsContainer = document.querySelector(".hearts");

    for (let i = 0; i < 20; i++) {
        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (3 + Math.random() * 5) + "s";
        heart.style.fontSize = (15 + Math.random() * 25) + "px";

        heartsContainer.appendChild(heart);
    }
}

createHearts();

console.log("starting matchmaker...")

function calculatecampatibility() {
    console.log("calculatecampatibility()")

    const DESIRED_RESPONSE = [
        4, /* agree */
        4, /* agree */
        5, /* strongly agree */
        3, /* neither agree nor disagree */
        4  /* agree */
    ]

    const MAX_SCORE = 25;

    // get the values of the dropdown controls.
    let question1Response = parseInt(document.getElementById("q1").value);
    let question2Response = parseInt(document.getElementById("q2").value);
    let question3Response = parseInt(document.getElementById("q3").value);
    let question4Response = parseInt(document.getElementById("q4").value);
    let question5Response = parseInt(document.getElementById("q5").value);

    // optionally log the vallues associated with question 1 through 5 to the console
    console.log("question 1 answers:")
    console.log(document.getElementById("q1").selectedOptions[0].text);
    console.log(document.getElementById("q1").selectedOptions[0].value);
    console.log(question1Response);

    console.log("question 2 answers:")
    console.log(document.getElementById("q2").selectedOptions[0].text);
    console.log(document.getElementById("q2").selectedOptions[0].value);
    console.log(question2Response);

    console.log("question 3 answers:")
    console.log(document.getElementById("q3").selectedOptions[0].text);
    console.log(document.getElementById("q3").selectedOptions[0].value);
    console.log(question3Response);

    console.log("question 4 answers:")
    console.log(document.getElementById("q4").selectedOptions[0].text);
    console.log(document.getElementById("q4").selectedOptions[0].value);
    console.log(question4Response);

    console.log("question 5 answers:")
    console.log(document.getElementById("q5").selectedOptions[0].text);
    console.log(document.getElementById("q5").selectedOptions[0].value);
    console.log(question5Response);

    // Todo: calculate compalibility scores.
    let question1compalibility = 5 - Math.abs(question1Response - DESIRED_RESPONSE[0]);
    let question2compalibility = 5 - Math.abs(question2Response - DESIRED_RESPONSE[1]);
    let question3compalibility = 5 - Math.abs(question3Response - DESIRED_RESPONSE[2]);
    let question4compalibility = 5 - Math.abs(question4Response - DESIRED_RESPONSE[3]);
    let question5compalibility = 5 - Math.abs(question5Response - DESIRED_RESPONSE[4]);


    // Calculate total compalibility.
    let totalCompalibility = question1compalibility + question2compalibility + question3compalibility + question4compalibility + question5compalibility;


    // Convert totalCompalibility to a percentage.
    totalCompalibility *= 100 / MAX_SCORE;
    totalCompalibility = Math.round(totalCompalibility);
    let message = "";

    if (totalCompalibility <= 75) {
    message = "Let's just be acquaintances.";
    } else if (totalCompalibility <= 94) {
    message = "Let's be friends!";
    } else {
    message = "How about we go out?";
    }
    console.log("tc=" + totalCompalibility);

    document.getElementById("campatibility").innerHTML = 
    "Your compatibility is " + totalCompalibility + "%<br>" + message;
}
</script>

</body>
</html>
